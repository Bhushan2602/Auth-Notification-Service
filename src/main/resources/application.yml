server:
  port: 8090

spring:
  application:
    name: auth-notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${SPRING_DATASOURCE_USERNAME:auth_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: auth-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.authplatform.*
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  # Google OAuth2 credentials come ONLY from environment (never committed):
  #   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
  #   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
  # When absent, SecurityConfig skips oauth2Login and the app runs local-auth only.

app:
  jwt:
    secret: ${JWT_SECRET:YXV0aC1wbGF0Zm9ybS1kZW1vLXNlY3JldC0yMDI2ISEhISEh}
    access-minutes: 15
    refresh-days: 7
  frontend-url: ${FRONTEND_URL:http://localhost:5174}
  rate-limit:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  mail:
    from: ${MAIL_FROM:no-reply@authplatform.local}
    demo-log: ${MAIL_DEMO_LOG:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
