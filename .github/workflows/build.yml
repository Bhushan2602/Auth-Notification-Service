name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x mvnw
      - run: ./mvnw -B package -DskipTests
      - name: Unit tests
        run: ./mvnw -B test "-Dtest=AuthServiceTest,RateLimitServiceTest,NotificationConsumerTest" "-DfailIfNoTests=false"
      - name: Integration test (Linux Docker host)
        run: ./mvnw -B test "-Dtest=AuthFlowIntegrationTest" "-DfailIfNoTests=false" "-Djunit.jupiter.conditions.deactivate=org.junit.*DisabledCondition"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
